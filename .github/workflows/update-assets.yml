name: Weekly BigTech IP Ranges Update

on:
  schedule:
    # Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  update-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run asset generator script
        run: |
          python scripts/bigtech_ranges.py

      - name: Check for changes
        id: git-check
        run: |
          git status
          if [[ -n "$(git status --porcelain docs/data/)" ]]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push updated assets
        if: steps.git-check.outputs.changes_detected == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add docs/data/
          git commit -m "chore(assets): weekly auto-update of BigTech IP ranges and taxonomies [skip ci]"
          git push
