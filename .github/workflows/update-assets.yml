name: Weekly BigTech IP Ranges Update

on:
  schedule:
    # Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  update-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run asset generator script
        run: |
          python scripts/bigtech_ranges.py

      - name: Prepare PR Body
        run: |
          BODY="Automated weekly update of BigTech IP ranges and taxonomies.\n\nGenerated by the \`Weekly BigTech IP Ranges Update\` workflow.\nPlease review the diff of \`docs/data/\` and merge if everything looks correct."
          if [ -f pipeline_warning.txt ]; then
            WARNING_CONTENT=$(cat pipeline_warning.txt)
            BODY="$BODY\n\n$WARNING_CONTENT"
          fi
          echo "PR_BODY<<EOF" >> $GITHUB_ENV
          echo -e "$BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(assets): weekly auto-update of BigTech IP ranges and taxonomies [skip ci]"
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          title: "chore(assets): weekly auto-update of BigTech IP ranges and taxonomies"
          body: ${{ env.PR_BODY }}
          branch: auto-update/bigtech-ranges
          base: main
          add-paths: |
            docs/data/
          labels: automated
